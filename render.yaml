# Render blueprint for the free-tier trial.
# Secrets are entered in the Render dashboard (never committed). After the first deploy works in demo mode,
# switch to live by adding HA_TOKEN there and changing HA_MODE to "live" (see README).
services:
  - type: web
    name: home-control
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HA_MODE
        value: demo
      - key: HA_URL
        value: https://home.dgarwood.co.uk
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
