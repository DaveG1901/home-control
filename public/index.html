<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050c1d">
<title>Home Control</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-3-2-5-3-7-1 2-2 3-3 3 0-3-1-6-4-9 0 4-4 6-4 12 0 4 3 8 7 8z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 15l4-5 3 3 5-7"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v4a6 6 0 01-12 0z"/><path d="M12 18v3"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h9a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M16 10l5-3v10l-5-3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s7 7 7 12a7 7 0 01-14 0c0-5 7-12 7-12z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.9 10.5c.8.7 1.2 1.5 1.2 2.5h5.4c0-1 .4-1.8 1.2-2.5A6 6 0 0012 3z"/></symbol>
  <linearGradient id="binShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".30" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".70" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".40"/>
  </linearGradient>
  <linearGradient id="binLid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity=".24"/>
  </linearGradient>
  <symbol id="i-bin" viewBox="0 0 64 84">
    <ellipse cx="32" cy="80.5" rx="23" ry="3" fill="#000" opacity=".4"/>
    <path d="M11 18H53L49.6 73.5Q49.4 77 46 77H18Q14.6 77 14.4 73.5Z" fill="currentColor"/>
    <path d="M11 18H53L49.6 73.5Q49.4 77 46 77H18Q14.6 77 14.4 73.5Z" fill="url(#binShade)"/>
    <rect x="21" y="31" width="22" height="5" rx="2.5" fill="#000" opacity=".26"/>
    <rect x="5" y="7" width="54" height="13" rx="4.5" fill="currentColor"/>
    <rect x="5" y="7" width="54" height="13" rx="4.5" fill="url(#binLid)"/>
    <rect x="22" y="2.5" width="20" height="6" rx="3" fill="currentColor"/>
    <rect x="22" y="2.5" width="20" height="6" rx="3" fill="#000" opacity=".2"/>
    <circle cx="19" cy="77.5" r="4" fill="#141b29"/><circle cx="45" cy="77.5" r="4" fill="#141b29"/>
  </symbol>
  <symbol id="i-caddy" viewBox="0 0 64 84">
    <ellipse cx="32" cy="80.5" rx="17" ry="2.6" fill="#000" opacity=".4"/>
    <path d="M23 36Q32 15 41 36" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M23 36Q32 15 41 36" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round" opacity=".25"/>
    <path d="M16 40H48L45.6 75Q45.4 78 42.6 78H21.4Q18.6 78 18.4 75Z" fill="currentColor"/>
    <path d="M16 40H48L45.6 75Q45.4 78 42.6 78H21.4Q18.6 78 18.4 75Z" fill="url(#binShade)"/>
    <rect x="13" y="33" width="38" height="9" rx="3.5" fill="currentColor"/>
    <rect x="13" y="33" width="38" height="9" rx="3.5" fill="url(#binLid)"/>
    <rect x="25" y="52" width="14" height="4" rx="2" fill="#000" opacity=".26"/>
  </symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
</defs></svg>

<div class="app">
<nav>
  <a class="logo" href="#/overview" aria-label="Home Control"><svg><use href="#i-home"/></svg></a>
  <a class="on" href="#/overview" data-view="overview" title="Overview" aria-label="Overview"><svg><use href="#i-home"/></svg><span class="lbl">Home</span></a>
  <a href="#/energy" data-view="energy" title="Energy" aria-label="Energy"><svg><use href="#i-bolt"/></svg><span class="lbl">Energy</span></a>
  <a href="#/heating" data-view="heating" title="Heating" aria-label="Heating"><svg><use href="#i-flame"/></svg><span class="lbl">Heating</span></a>
  <a href="#/security" data-view="security" title="Security" aria-label="Security"><svg><use href="#i-shield"/></svg><span class="lbl">Security</span></a>
  <a href="#/devices" data-view="devices" title="Devices" aria-label="Devices"><svg><use href="#i-plug"/></svg><span class="lbl">Devices</span></a>
  <a href="#/reports" data-view="reports" title="Reports" aria-label="Reports"><svg><use href="#i-chart"/></svg><span class="lbl">Reports</span></a>
  <div class="nav-spacer"></div>
  <button class="link" id="logout">Sign out</button>
</nav>
<main>
  <div class="top">
    <div class="title"><h1 id="greeting">Home</h1><div class="sub" id="subtitle"></div></div>
    <div class="top-right">
      <div class="chips" id="chips"></div>
      <div class="actions">
        <div class="chips" id="status"></div>
        <button class="signout-m" id="logout-m" aria-label="Sign out" title="Sign out"><svg><use href="#i-logout"/></svg></button>
      </div>
    </div>
  </div>
  <div class="grid">
    <section class="card c8" id="energy"></section>
    <section class="card c4" id="today"></section>
    <section class="card c8" id="surplus"></section>
    <section class="card c5" id="heating"></section>
    <section class="card c7" id="security"></section>
    <section class="card c7" id="power"></section>
    <section class="card c5" id="bins"></section>
    <section class="card c5" id="controls"></section>
    <section class="card c12" id="plugs"></section>
    <section class="card c12" id="lights"></section>
    <section class="card c6" id="activity"></section>
    <section class="card c6" id="consumers"></section>
  </div>
</main>
</div>
<div class="toast" id="toast"></div>
<script src="/vendor/hls.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
